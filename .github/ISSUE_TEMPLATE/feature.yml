name: 기능 제안
description: 새 기능이나 개선 작업을 제안합니다.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options:
        - PC 웹
        - iPhone
        - Apple Watch
        - 백엔드
        - 문서·기획
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 사용자나 팀이 현재 겪는 문제를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 기대 결과
      description: 완료되었을 때 확인할 수 있는 결과를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 자료
