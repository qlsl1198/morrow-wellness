name: Documentation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check repository structure
        run: |
          test -f README.md
          test -f CONTRIBUTING.md
          test -d docs
          if git ls-files apps backend infra | grep -q .; then
            echo "Application source must live in the frontend or backend repository."
            exit 1
          fi
      - name: Check whitespace errors
        run: git show --check --format= HEAD
